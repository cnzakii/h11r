version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "1.91"
  jobs:
    install:
      - uv sync --locked --no-dev --all-packages --group benchmark --group docs
    pre_build:
      - sed -i "s|^site_url = .*|site_url = \"$READTHEDOCS_CANONICAL_URL\"|" zensical.toml
    build:
      html:
        - uv run --no-sync python crates/h11r-python/benchmarks/render_results.py docs/assets/python-benchmark.json --svg docs/assets/python-benchmark.svg --table target/docs/python-benchmark.md
        - uv run --no-sync python docs/griffe_runtime_docstrings.py
        - uv run --no-sync zensical build --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html"
      - cp --recursive site/. "$READTHEDOCS_OUTPUT/html/"

python:
  # Provision uv; the custom install job enforces the locked docs-only sync.
  install:
    - method: uv
      command: sync
      groups:
        - benchmark
        - docs
