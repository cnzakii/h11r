name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      maturin-version: ${{ steps.maturin.outputs.version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify tag and package version
        if: github.event_name == 'push'
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test -n "$version"
          test "$RELEASE_TAG" = "v$version"
          grep -Fq "## [$version] - " CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - name: Read locked maturin version
        id: maturin
        run: |
          version="$(uv run --locked maturin --version)"
          version="${version#maturin }"
          test -n "$version"
          echo "version=v$version" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: cargo publish --dry-run -p h11r --locked

  wheels:
    name: Wheel (${{ matrix.platform }}, ${{ matrix.abi-profile }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - manylinux-x86_64
          - manylinux-aarch64
          - musllinux-x86_64
          - musllinux-aarch64
          - macos-x86_64
          - macos-aarch64
          - windows-x86_64
          - windows-aarch64
        abi-profile: [abi3, cp314t, abi3t]
        include:
          - platform: manylinux-x86_64
            os: ubuntu-22.04
            target: x86_64
            manylinux: "2014"
          - platform: manylinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - platform: musllinux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - platform: musllinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: auto
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64
            manylinux: auto
          - platform: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: auto
          - platform: windows-aarch64
            os: windows-11-arm
            target: aarch64
            manylinux: auto
          # pypa-interpreter is the interpreter path in the pypa manylinux and
          # musllinux images. The musllinux build images from rust-cross do
          # not ship CPython, so those builds pass interpreter-name and
          # maturin resolves it from its bundled sysconfig data.
          - abi-profile: abi3
            python-version: "3.12"
            pypa-interpreter: /opt/python/cp312-cp312/bin/python
            interpreter-name: python3.12
            wheel-tag: cp311-abi3
          - abi-profile: cp314t
            python-version: "3.14t"
            pypa-interpreter: /opt/python/cp314-cp314t/bin/python
            interpreter-name: python3.14t
            wheel-tag: cp314-cp314t
          # The abi3t wheel is also the preferred wheel on GIL-enabled
          # CPython 3.15+, so it is smoke-tested on both builds.
          - abi-profile: abi3t
            python-version: "3.15t"
            pypa-interpreter: /opt/python/cp315-cp315t/bin/python
            interpreter-name: python3.15t
            gil-python-version: "3.15"
            gil-pypa-interpreter: /opt/python/cp315-cp315/bin/python
            wheel-tag: cp315-abi3.abi3t
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: build-python
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: actions/setup-python@v7
        id: gil-python
        if: matrix.gil-python-version && !startsWith(matrix.platform, 'musllinux-')
        with:
          python-version: ${{ matrix.gil-python-version }}
          allow-prereleases: true
          update-environment: false
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ needs.validate.outputs.maturin-version }}
          working-directory: crates/h11r-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --locked --compatibility pypi
            --interpreter ${{ startsWith(matrix.platform, 'manylinux-') && matrix.pypa-interpreter || startsWith(matrix.platform, 'musllinux-') && matrix.interpreter-name || steps.build-python.outputs.python-path }}
            --out dist
      - name: Validate wheel tag
        id: wheel
        shell: bash
        working-directory: crates/h11r-python
        run: |
          set -- dist/*.whl
          test "$#" -eq 1
          wheel="$1"
          test -f "$wheel"
          case "$(basename "$wheel")" in
            *-${{ matrix.wheel-tag }}-*.whl) ;;
            *) echo "unexpected wheel tag: $wheel" >&2; exit 1 ;;
          esac
          echo "path=$wheel" >> "$GITHUB_OUTPUT"
      - name: Smoke-test wheel
        shell: bash
        working-directory: crates/h11r-python
        env:
          PLATFORM: ${{ matrix.platform }}
          WHEEL: ${{ steps.wheel.outputs.path }}
          FREE_THREADED: ${{ matrix.abi-profile != 'abi3' }}
          BUILD_PYTHON: ${{ steps.build-python.outputs.python-path }}
          GIL_PYTHON: ${{ steps.gil-python.outputs.python-path }}
          PYPA_INTERPRETER: ${{ matrix.pypa-interpreter }}
          GIL_PYPA_INTERPRETER: ${{ matrix.gil-pypa-interpreter }}
        run: |
          check() {
            "$@" -m pip install "$wheel"
            "$@" -c "import h11r"
          }
          case "$PLATFORM" in
            musllinux-*)
              # The host Python links against glibc, so musl wheels are
              # installed into the matching pypa musllinux image.
              docker run --detach --name smoke --volume "$PWD/dist:/dist:ro" \
                "quay.io/pypa/musllinux_1_2_$(uname -m)" sleep infinity
              wheel="/dist/$(basename "$WHEEL")"
              python=(docker exec smoke "$PYPA_INTERPRETER")
              gil_python=(docker exec smoke "$GIL_PYPA_INTERPRETER")
              ;;
            *)
              wheel="$WHEEL"
              python=("$BUILD_PYTHON")
              gil_python=("$GIL_PYTHON")
              ;;
          esac
          check "${python[@]}"
          if [ "$FREE_THREADED" = true ]; then
            "${python[@]}" -c "import h11r, sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED'); assert not sys._is_gil_enabled()"
          fi
          if [ -n "$GIL_PYPA_INTERPRETER" ]; then
            check "${gil_python[@]}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.platform }}-${{ matrix.abi-profile }}
          path: crates/h11r-python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: ${{ needs.validate.outputs.maturin-version }}
          working-directory: crates/h11r-python
          args: --out dist
      - name: Smoke-test source distribution
        run: |
          python -m pip install crates/h11r-python/dist/*.tar.gz
          python -c "import h11r"
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: crates/h11r-python/dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [validate, wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: [validate, wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether the crate version already exists
        id: crate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          status="$(curl --silent \
            --user-agent "h11r-release (+https://github.com/$GITHUB_REPOSITORY)" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/h11r/$VERSION")"
          case "$status" in
            200) exists=true ;;
            404) exists=false ;;
            *) echo "crates.io returned HTTP $status" >&2; exit 1 ;;
          esac
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.crate.outputs.exists == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        if: steps.crate.outputs.exists == 'false'
        run: cargo publish -p h11r --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [publish-pypi, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
