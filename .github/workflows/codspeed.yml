name: CodSpeed

# Runs on every main push so pull requests always have a baseline to compare.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request run supersedes its previous one; each main commit keeps its
# own group so none of them loses its baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CodSpeed uses OIDC, so no long-lived upload token is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodSpeed's tracing needs the setup-python interpreter, not a uv-managed one.
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: uv sync --locked --group benchmark
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: uv --directory crates/h11r-python run --no-sync maturin develop --release
      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: uv run --no-sync pytest crates/h11r-python/benchmarks/test_codspeed.py --codspeed
