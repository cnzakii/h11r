version: 2
updates:
  - package-ecosystem: cargo
    # The fuzz harness has its own Cargo manifest and lockfile.
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: monthly

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The action has no release tags, so Dependabot cannot update its SHA
      # pin; refresh it by hand. Its `toolchain` input, not its commit,
      # selects the tested Rust versions.
      - dependency-name: dtolnay/rust-toolchain
